services:
  db:
    image: mysql:8.4
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    working_dir: /app
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://inventory:${MYSQL_PASSWORD}@db:3306/inventory?connection_limit=20
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET}
      WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-@advancedresearchpep.com}
      INTERNAL_SYNC_TOKEN: ${INTERNAL_SYNC_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # BUILD CONTRACT (codex #4): `docker compose build app migrate` before every `up` —
    # building only `app` does NOT retag this image; a stale migrate image runs old migrations.
    command: >-
      sh -lc "./node_modules/.bin/prisma migrate deploy && node scripts/migrate-to-multitenant.js && node scripts/seed-default-location.js"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # /api/version probe: `GIT_SHA=$(git rev-parse HEAD) docker compose ...
        # build` pins the sha explicitly; unset falls back to the .git/HEAD the
        # .dockerignore negations let into the context.
        GIT_SHA: ${GIT_SHA:-}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      HOST: 0.0.0.0
      DATABASE_URL: mysql://inventory:${MYSQL_PASSWORD}@db:3306/inventory?connection_limit=20
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET}
      WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRET}
      WEBHOOK_DEBUG_HEADERS: ${WEBHOOK_DEBUG_HEADERS:-0}
      # Lane 6 egress lockdown. Default-deny: unset means OFF (the correct prod
      # value). "off" | "dry-run" | "on" ONLY — any other value fails closed to OFF
      # and turns healthz red. PLATFORM_WRITE_CAPABILITIES is a comma list of the
      # capabilities allowed when writes are on (e.g. "stock_status"); one bad
      # token empties the whole allowlist. Both are byte-exact.
      PLATFORM_WRITES: ${PLATFORM_WRITES:-off}
      PLATFORM_WRITE_CAPABILITIES: ${PLATFORM_WRITE_CAPABILITIES:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-advancedresearchpep.com}
      INTERNAL_SYNC_TOKEN: ${INTERNAL_SYNC_TOKEN}
      CRON_SECRET: ${CRON_SECRET}
      # I3: forward SendGrid + analytics tunables the APP reads (lib/email.ts,
      # app/api/cron/analytics-rebuild + app/api/admin/analytics-rebuild). Passthrough
      # (empty default) so an unset value stays unset rather than erroring compose.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      TEMPLATE_ID: ${TEMPLATE_ID:-}
      ANALYTICS_SNAPSHOT_NIGHTLY_DAYS: ${ANALYTICS_SNAPSHOT_NIGHTLY_DAYS:-}
      ANALYTICS_SALES_NIGHTLY_ROLLING_DAYS: ${ANALYTICS_SALES_NIGHTLY_ROLLING_DAYS:-}
      ANALYTICS_SALES_NIGHTLY_LOOKBACK_HOURS: ${ANALYTICS_SALES_NIGHTLY_LOOKBACK_HOURS:-}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    labels: {}
    volumes:
      - db_backups:/backup

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      NODE_ENV: production
      ENABLE_MCP: ${ENABLE_MCP:-0}
      DATABASE_URL: mysql://inventory:${MYSQL_PASSWORD}@db:3306/inventory?connection_limit=20
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MCP_PORT: 8080
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 5
    networks:
      - internal

  backup:
    image: fradelg/mysql-cron-backup
    environment:
      MYSQL_HOST: db
      MYSQL_USER: inventory
      MYSQL_PASS: ${MYSQL_PASSWORD}
      MYSQL_DB: inventory
      CRON_TIME: "0 3 * * *"
      MYSQLDUMP_OPTS: "--single-transaction --quick --routines --events --no-tablespaces"
      TZ: UTC
    volumes:
      - db_backups:/backup
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  sync:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      NODE_ENV: production
      ENABLE_EXTERNAL_SYNC: ${ENABLE_EXTERNAL_SYNC:-0}
      EXTERNAL_SYNC_INTERVAL_MINUTES: ${EXTERNAL_SYNC_INTERVAL_MINUTES:-15}
      EXTERNAL_SYNC_LOOKBACK_DAYS: ${EXTERNAL_SYNC_LOOKBACK_DAYS:-1}
      EXTERNAL_SYNC_MAX_ORDERS: ${EXTERNAL_SYNC_MAX_ORDERS:-250}
      INTERNAL_SYNC_URL: ${INTERNAL_SYNC_URL:-http://app:3000/api/cron/external-sync}
      INTERNAL_SYNC_TOKEN: ${INTERNAL_SYNC_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -lc "node scripts/scheduled-external-sync.js"
    networks:
      - internal

  analytics-rebuild:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      NODE_ENV: production
      ENABLE_ANALYTICS_REBUILD: ${ENABLE_ANALYTICS_REBUILD:-0}
      ANALYTICS_REBUILD_URL: ${ANALYTICS_REBUILD_URL:-http://app:3000/api/cron/analytics-rebuild}
      CRON_SECRET: ${CRON_SECRET}
      ANALYTICS_REBUILD_TICK_MINUTES: ${ANALYTICS_REBUILD_TICK_MINUTES:-30}
      ANALYTICS_NIGHTLY_HOUR_UTC: ${ANALYTICS_NIGHTLY_HOUR_UTC:-3}
      ANALYTICS_FULL_DOW: ${ANALYTICS_FULL_DOW:-0}
      ANALYTICS_FULL_HOUR_UTC: ${ANALYTICS_FULL_HOUR_UTC:-4}
      ANALYTICS_SNAPSHOT_NIGHTLY_DAYS: ${ANALYTICS_SNAPSHOT_NIGHTLY_DAYS:-3}
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -lc "node scripts/scheduled-analytics-rebuild.js"
    networks:
      - internal

  fulfillment-sync:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      NODE_ENV: production
      ENABLE_FULFILLMENT_SYNC: ${ENABLE_FULFILLMENT_SYNC:-0}
      FULFILLMENT_SYNC_URL: ${FULFILLMENT_SYNC_URL:-http://app:3000/api/cron/fulfillment-sync}
      CRON_SECRET: ${CRON_SECRET}
      FULFILLMENT_INCREMENTAL_MINUTES: ${FULFILLMENT_INCREMENTAL_MINUTES:-10}
      FULFILLMENT_BACKFILL_MINUTES: ${FULFILLMENT_BACKFILL_MINUTES:-30}
      FULFILLMENT_RECONCILE_HOURS: ${FULFILLMENT_RECONCILE_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -lc "node scripts/scheduled-fulfillment-sync.js"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  db_backups:
