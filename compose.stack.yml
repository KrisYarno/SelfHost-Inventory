# Production stack override (reverse proxy runs in an external Docker network).
#
# Usage:
#   docker compose -f docker-compose.yml -f compose.stack.yml --env-file .env up -d
#
# Notes:
# - ENVIRONMENT-NEUTRAL (2026-08-07 convergence): the auth URL comes from the
#   server-owned .env (NEXTAUTH_URL). No deployment identity in this tracked file.
# - Ingress = the `inventory` alias on the external network — that name is what the
#   front (static Caddyfile / cloudflared tunnel) resolves. NO routing labels here:
#   label-driven routing would need caddy-docker-proxy, which this stack does not run,
#   and a second source of routing truth is worse than none (verified 2026-08-07).
# - Expects an external network (default: "stack_network"). Set STACK_NETWORK_NAME to
#   override.
# - restart policies live HERE (the server adopts this file verbatim; nothing should
#   stay down after a host reboot).

services:
  app:
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}
    networks:
      stack_network:
        aliases: [inventory]
      internal:

  db:
    restart: unless-stopped

  backup:
    restart: unless-stopped

  sync:
    restart: unless-stopped

  analytics-rebuild:
    restart: unless-stopped

  # Only correct while ENABLE_FULFILLMENT_SYNC=1 (the script runs a real loop).
  # If the flag ever goes back to 0, REMOVE this — the disabled path exits 0
  # and would crash-loop under a restart policy.
  fulfillment-sync:
    restart: unless-stopped

networks:
  stack_network:
    external: true
    name: ${STACK_NETWORK_NAME:-stack_network}
